<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3d271a" />
    <title>Offline · Keris AI</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #241a12;
        --brown: #3d271a;
        --gold: #c4923a;
        --parchment: #f7f1e5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--parchment);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 460px;
        text-align: center;
        border: 1px solid #e9d7b8;
        border-radius: 24px;
        background: #fffdf8;
        padding: 40px 28px;
        box-shadow: 0 18px 40px -24px rgba(61, 39, 26, 0.45);
      }
      .mark {
        width: 88px;
        height: 88px;
        margin: 0 auto 20px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: var(--brown);
        color: #e8c67a;
        font-size: 44px;
        line-height: 1;
      }
      h1 { margin: 0; font-family: Georgia, serif; font-size: 28px; }
      p { margin: 12px 0 0; line-height: 1.6; color: #5d3a25; font-size: 14px; }
      button {
        margin-top: 24px;
        min-height: 44px;
        border: 0;
        border-radius: 999px;
        padding: 12px 24px;
        background: var(--ink);
        color: var(--parchment);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #5d3a25; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">ꦏ</div>
      <h1>Anda sedang offline</h1>
      <p>
        Halaman ini belum tersedia tanpa koneksi. Sambungkan kembali perangkat ke
        internet, lalu muat ulang untuk melanjutkan.
      </p>
      <button type="button" onclick="location.reload()">Muat Ulang</button>
    </main>
  </body>
</html>
